<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>리더보드 — 과학뉴스 검증 대회</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--
  리더보드.

  마감 전 — 진행 현황만 보인다
    팀 / 1차 / 2차-1 / 2차-2 / 2차-3 제출 여부 / 마지막 제출 시각
    점수는 절대 보이지 않는다. 남의 점수를 보고 지침을 베끼는 일을 막는다.

  마감 후 — 전체 공개
    순위 · 팀 · 채택 회차 · 원점수 · 계수 · 최종 · 인용일치 · 오탐 · 제출시각
    정렬은 Worker 가 scoring.js 의 compareTeams 로 해서 내려준다
    난이도별 평균 적발률, 문항별 정답률도 함께 보여준다
    오른쪽 위에 "결과 발표 모드" 링크가 생긴다 → reveal.html (시상식용, 꼴찌 팀부터 한 문항씩 공개)

  마감 여부는 Worker 가 정한다(DEADLINE_ISO 또는 운영자 강제 전환). 브라우저 시각으로 판단하지 않는다.
  60초마다 새로 고친다 (Worker 쪽 캐시도 60초).
-->
<main class="wide">
  <div class="row" style="justify-content:space-between">
    <div>
      <h1>리더보드</h1>
      <p class="lead" id="lead">불러오는 중…</p>
    </div>
    <div class="right small muted" id="meta"></div>
  </div>
  <div id="content"></div>
  <footer>순위는 2차 세 회차 중 가중 점수가 가장 높은 하나로 정합니다. 동점이면 인용 일치 많은 순 → 오탐 적은 순 → 먼저 제출한 순.</footer>
</main>
<script type="module" src="board.js"></script>
</body>
</html>
